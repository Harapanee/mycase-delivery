name: リール公開

# public リポジトリのため pull_request トリガーは付けない。
on:
  schedule:
    # ★GitHub の定時実行は遅延するだけでなく、高負荷時にキューされず破棄される。
    #   遅れて来るのではなく、その回が永久に来ない。
    #   2026-08-29 のしゅうとキャリアで 21:00 JST 枠が発火せず手動投稿で復旧している
    #   (実行履歴に event: schedule の行が1件も無いことで確認)。
    #   対策は1発勝負をやめて枠ごとに4発置くこと。publish.py は
    #   「published ならスキップ」「予定時刻から±90分外ならスキップ」なので
    #   何発撃っても二重投稿にならない(tests/test_publish.py で検証済み)。
    #   毎時 :00 は世界中の cron が集中して最も遅延しやすいため :41 / :48 / :56 を主軸にする。
    - cron: '41 20 * * *'     # 05:41 JST ┐
    - cron: '48 20 * * *'     # 05:48 JST │ 06:00枠(UTC では前日 20時台)
    - cron: '56 20 * * *'     # 05:56 JST │
    - cron: '3 21 * * *'      # 06:03 JST ┘
    - cron: '41 2 * * *'      # 11:41 JST ┐
    - cron: '48 2 * * *'      # 11:48 JST │ 12:00枠
    - cron: '56 2 * * *'      # 11:56 JST │
    - cron: '3 3 * * *'       # 12:03 JST ┘
    - cron: '41 8 * * *'      # 17:41 JST ┐
    - cron: '48 8 * * *'      # 17:48 JST │ 18:00枠
    - cron: '56 8 * * *'      # 17:56 JST │
    - cron: '3 9 * * *'       # 18:03 JST ┘
    # ★英語 @mycase_en の枠(2026-09-17)。米国向けに 08:00 / 22:00 / 01:00 JST。
    #   同じ4発方式。日本語側はこの時刻に自分の枠が無い(窓外 or 公開済み)のでスキップする。
    - cron: '41 22 * * *'     # 07:41 JST ┐
    - cron: '48 22 * * *'     # 07:48 JST │ 08:00枠(EN。UTC では前日 22時台)
    - cron: '56 22 * * *'     # 07:56 JST │
    - cron: '3 23 * * *'      # 08:03 JST ┘
    - cron: '41 12 * * *'     # 21:41 JST ┐
    - cron: '48 12 * * *'     # 21:48 JST │ 22:00枠(EN)
    - cron: '56 12 * * *'     # 21:56 JST │
    - cron: '3 13 * * *'      # 22:03 JST ┘
    - cron: '41 15 * * *'     # 00:41 JST ┐
    - cron: '48 15 * * *'     # 00:48 JST │ 01:00枠(EN)
    - cron: '56 15 * * *'     # 00:56 JST │
    - cron: '3 16 * * *'      # 01:03 JST ┘
  # ★2026-09-13: GitHub の schedule は公開直後のリポジトリで最大5時間遅れ、12:00/18:00 枠が
  #   窓(+3時間)の外で全スキップされた。発火自体を GitHub に任せず、Claude のクラウド定期実行が
  #   毎日 05:55/11:55/17:55 JST に trigger/fire.txt へ1行追記して push する。push は即時発火する。
  #   state.json の commit は paths に含まれないのでループしない。schedule の4発は保険として残す。
  #   2026-09-17: 英語 @mycase_en 用に 07:55/21:55/00:55 JST も同じ定期実行に追加(cron 55 20,2,8,22,12,15 UTC)。
  push:
    branches: [master]
    paths: ['trigger/**']
  workflow_dispatch:
    inputs:
      key:
        description: '取りこぼしを手動で公開するときだけ指定(例 001_20260913_0600)。空なら通常どおり時刻で選ぶ'
        required: false
        default: ''
      key_en:
        description: '同上、英語 @mycase_en 用(accounts/en/schedule.json のキー)'
        required: false
        default: ''

concurrency:
  group: ig-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★1枠4発にしたことで新たに必要になった手当て。
      #   checkout は schedule イベントでは「起動時点の SHA」を取る。cron が遅延して
      #   2発がほぼ同時に作られると、後発は先発が push した state.json を見ないまま
      #   起動し、二重投稿する。concurrency は実行順を直列化するだけで内容は更新しない。
      #   公開の直前に state.json だけ origin の先頭から取り直して塞ぐ。
      - name: state.json を origin の最新にする
        run: |
          git fetch --depth=1 origin ${{ github.event.repository.default_branch }}
          git checkout FETCH_HEAD -- state.json || echo "state.json はまだ無い(初回)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: リールを公開する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLISH_KEY: ${{ inputs.key }}
        run: python publish/publish.py
      - name: state.json を保存する
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 投稿結果を記録"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push
          fi

  # ★英語 @mycase_en(2026-09-17 追加)。日本語と同じ枠・同じ発火で、schedule/state は accounts/en/ に分離。
  #   needs で日本語の後に直列に走らせる(同時に push すると片方が弾かれるため)。
  #   Secrets IG_USER_ID_EN が空、または accounts/en/schedule.json が無い間はスキップして緑。
  publish-en:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: accounts/en/state.json を origin の最新にする
        run: |
          git fetch --depth=1 origin ${{ github.event.repository.default_branch }}
          git checkout FETCH_HEAD -- accounts/en/state.json || echo "accounts/en/state.json はまだ無い(初回)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: リールを公開する(@mycase_en)
        env:
          IG_ACCOUNT: en
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_EN }}
          PUBLISH_KEY: ${{ inputs.key_en }}
        run: python publish/publish.py
      - name: accounts/en/state.json を保存する
        if: always()
        run: |
          if [[ -n "$(git status --porcelain accounts/en/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add accounts/en/state.json
            git commit -m "chore(en): 投稿結果を記録"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push
          fi

